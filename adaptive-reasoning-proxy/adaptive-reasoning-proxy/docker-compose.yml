services:
  proxy:
    build: ./proxy
    ports:
      - "8000:8000"
    environment:
      # llama-server runs on the host; host.docker.internal reaches it.
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LLM_API_KEY=${LLM_API_KEY:-none}
      - REDIS_URL=redis://redis:6379
      - EMBEDDINGS_ENABLED=${EMBEDDINGS_ENABLED:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      - ./proxy:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    depends_on:
      - proxy
