services:
  proxy:
    build: ./proxy
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./proxy:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    depends_on:
      - proxy
